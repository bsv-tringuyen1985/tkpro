# TKPRO — reverse proxy duy nhất phía browser.
#
# GIẢ ĐỊNH QUAN TRỌNG (về /admin):
#   cms là app Laravel có TOÀN BỘ route đăng ký dưới prefix /admin
#   (APP_URL=http://localhost, ADMIN_PATH_PREFIX=admin).
#   Nginx KHÔNG rewrite path — request /admin/login tới cms:8001 nguyên vẹn
#   dưới dạng /admin/login, cms tự định tuyến. Vì vậy block /admin/ dùng
#   proxy_pass KHÔNG kèm URI (giữ nguyên path).
#
# Tương tự /api/: proxy_pass không kèm URI nên /api/v1/products tới api:8000
# nguyên vẹn — api định tuyến /api/... như bình thường.

upstream frontend {
    server frontend:3000;
}

upstream api {
    server api:8000;
}

upstream cms {
    server cms:8001;
}

server {
    listen 80;
    server_name _;

    # Upload media qua cms/api (tối đa 10MB)
    client_max_body_size 10M;

    # Nén gzip cho text-based responses
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/rss+xml image/svg+xml font/ttf font/otf;

    # --- Sitemap & robots: route web của api (không nằm /api/v1) ---
    location = /sitemap.xml {
        proxy_pass http://api;
    }
    location = /robots.txt {
        proxy_pass http://api;
    }

    # --- API: giữ nguyên path /api/... ---
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- CMS: giữ nguyên path /admin/... (cms tự xử lý prefix /admin) ---
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        proxy_pass http://cms;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- File tĩnh upload: /storage/... → api ---
    location /storage/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # --- Storefront Next.js ---
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
